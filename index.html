<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Karthik Tsaliki — Wisdom Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --ink: #eef1fa;
    --ink-dim: #8a93a8;
    --ink-faint: #4a516a;
    --panel: rgba(8, 12, 24, 0.72);
    --panel-border: rgba(167, 139, 250, 0.22);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background:
      radial-gradient(ellipse 70% 50% at 30% 12%, #141b3a 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 78% 85%, #221432 0%, transparent 55%),
      radial-gradient(ellipse at center, #060914 0%, #02030a 100%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }
  #stars, #nebula, #graph, #hud { position: fixed; inset: 0; }
  #stars { z-index: 0; pointer-events: none; }
  #nebula { z-index: 1; pointer-events: none; opacity: 0.6;
    background:
      radial-gradient(circle at 78% 28%, rgba(167,139,250,0.22), transparent 42%),
      radial-gradient(circle at 12% 82%, rgba(251,146,60,0.10), transparent 40%),
      radial-gradient(circle at 55% 60%, rgba(56,189,248,0.10), transparent 48%),
      radial-gradient(circle at 85% 72%, rgba(244,114,182,0.10), transparent 40%);
    filter: blur(26px);
  }
  #graph { z-index: 2; }
  #hud { z-index: 3; pointer-events: none; }
  #hud > * { pointer-events: auto; }

  header.title { position: absolute; top: 28px; left: 36px; max-width: 60%; }
  header.title h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(30px, 3.6vw, 48px);
    margin: 0;
    letter-spacing: 0.01em;
    background: linear-gradient(120deg, #ffffff 0%, #fcd34d 40%, #a78bfa 80%, #f472b6 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 20px rgba(167,139,250,0.2));
  }
  header.title h1 .amp { font-style: italic; opacity: 0.82; }
  header.title p {
    margin: 8px 0 0; color: var(--ink-dim);
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    font-weight: 300;
  }
  header.title .dot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: #fcd34d; margin: 0 10px 2px; vertical-align: middle;
    box-shadow: 0 0 10px #fcd34d;
  }

  .legend {
    position: absolute; top: 28px; right: 36px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 18px 20px;
    font-size: 12px;
    min-width: 220px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .legend h4 {
    margin: 0 0 12px; font-weight: 500;
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .legend ul { list-style: none; margin: 0; padding: 0; }
  .legend li {
    display: flex; align-items: center; gap: 11px;
    padding: 5px 0; color: var(--ink);
    cursor: pointer; transition: transform .2s;
    font-weight: 400;
  }
  .legend li:hover { transform: translateX(2px); }
  .legend .sw {
    width: 11px; height: 11px; border-radius: 50%;
    box-shadow: 0 0 14px currentColor;
  }

  .panel {
    position: absolute; left: 36px; bottom: 36px;
    width: min(440px, 42vw);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 18px;
    padding: 24px 26px;
    transition: opacity .35s ease, transform .35s ease;
    opacity: 0; transform: translateY(12px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  .panel.active { opacity: 1; transform: translateY(0); }
  .panel .eyebrow {
    font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--ink-dim); margin-bottom: 8px; font-weight: 500;
  }
  .panel h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px; margin: 0 0 12px; font-weight: 500;
  }
  .panel p { margin: 0; color: #b4bcd0; line-height: 1.6; font-size: 14px; }
  .panel .links { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
  .panel .chip {
    font-size: 11px; padding: 5px 11px; border-radius: 999px;
    border: 1px solid; background: rgba(255,255,255,0.02);
    cursor: pointer; transition: background .2s, transform .2s;
  }
  .panel .chip:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }

  .hint {
    position: absolute; right: 36px; bottom: 28px;
    font-size: 10px; color: var(--ink-faint); letter-spacing: 0.18em;
    text-transform: uppercase; font-weight: 400;
  }

  /* Graph */
  .link {
    stroke: rgba(167,139,250,0.18);
    stroke-width: 1;
    transition: stroke-opacity .3s, stroke-width .3s;
  }
  .link.backbone {
    stroke: rgba(252,211,77,0.38);
    stroke-width: 1.5;
    stroke-dasharray: 2 5;
  }
  .link.faded { stroke-opacity: 0.04; }
  .link.active { stroke-width: 2; stroke-opacity: 0.95; }

  .edge-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px; font-weight: 300;
    fill: #f5f3ff;
    text-transform: lowercase;
    letter-spacing: 0.08em;
    paint-order: stroke;
    stroke: rgba(3, 5, 12, 0.92);
    stroke-width: 3.5px;
    stroke-linejoin: round;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s;
  }
  .edge-label.active { opacity: 1; }

  .node { cursor: pointer; }
  .node .halo { opacity: 0.14; transition: opacity .35s; }
  .node .body {
    stroke: rgba(255,255,255,0.4);
    stroke-width: 1;
    transition: stroke-width .2s;
  }
  .node.core .body { stroke: #fff; stroke-width: 2; }
  .node:hover .halo { opacity: 0.38; }
  .node:hover .body { stroke-width: 2; }
  .node text {
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 400;
    fill: var(--ink);
    pointer-events: none;
    paint-order: stroke;
    stroke: rgba(3, 5, 12, 0.9);
    stroke-width: 3.5px;
    stroke-linejoin: round;
    letter-spacing: 0.01em;
  }
  .node.wisdom text {
    font-style: italic;
    font-size: 10px;
    fill: #fef3c7;
  }
  .node.core text {
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .node.faded { opacity: 0.08; }
  .node.faded text { opacity: 0; }

  @keyframes pulseRing {
    0%   { r: 28; opacity: 0.55; }
    100% { r: 70; opacity: 0; }
  }
  .pulse-ring {
    fill: none; stroke: #ffffff; stroke-width: 1.2;
    animation: pulseRing 3s ease-out infinite;
  }
  .pulse-ring.delay { animation-delay: 1.5s; }

  @keyframes twinkle { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  .star { animation: twinkle var(--d, 3s) ease-in-out infinite; }

  @media (max-width: 820px) {
    header.title { left: 20px; top: 18px; max-width: 92%; }
    .legend { right: 20px; top: unset; bottom: 20px; min-width: 180px; padding: 14px 16px; }
    .panel { left: 20px; right: 20px; bottom: 220px; width: auto; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<svg id="stars"></svg>
<div id="nebula"></div>
<svg id="graph"></svg>

<div id="hud">
  <header class="title">
    <h1>Karthik Tsaliki <span class="amp">— a wisdom map</span></h1>
    <p>Big Bang <span class="dot"></span> Wisdom Through Time <span class="dot"></span> Now</p>
  </header>

  <aside class="legend" id="legend">
    <h4>Constellations</h4>
    <ul></ul>
  </aside>

  <section class="panel" id="panel">
    <div class="eyebrow" id="panel-eyebrow">Self</div>
    <h2 id="panel-title">Karthik Tsaliki</h2>
    <p id="panel-body">Hover any node to see its verbs. Click to pin.</p>
    <div class="links" id="panel-chips"></div>
  </section>

  <div class="hint">Drag · Zoom · Click nodes · Hover for verbs</div>
</div>

<script>
/* =========================================================
   Starfield
   ========================================================= */
(function stars() {
  const svg = document.getElementById('stars');
  const w = window.innerWidth, h = window.innerHeight;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  let html = '';
  for (let i = 0; i < 240; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = Math.random() * 1.3 + 0.2;
    const d = (Math.random() * 5 + 2).toFixed(1);
    const op = (Math.random() * 0.6 + 0.25).toFixed(2);
    html += `<circle class="star" cx="${x}" cy="${y}" r="${r}" fill="#fff" style="--d:${d}s" opacity="${op}"/>`;
  }
  svg.innerHTML = html;
})();

   Palette
   ========================================================= */

  cosmos:     { solid: '#fcd34d', deep: '#92400e' },

  attention:  { solid: '#34d399', deep: '#064e3b' },

  producer:   { solid: '#fb923c', deep: '#7c2d12' },

  { s: 'writing',         t: 'nlp',             rel: 'mirrors' },

/* =========================================================
   Render legend
   ========================================================= */
(function legend() {
  const ul = document.querySelector('#legend ul');
  Object.entries(groupLabels).forEach(([k, label]) => {
    const li = document.createElement('li');
    li.dataset.group = k;
    li.innerHTML = `<span class="sw" style="background:${palette[k].solid};color:${palette[k].solid}"></span>${label}`;
    li.addEventListener('mouseenter', () => highlightGroup(k));
    li.addEventListener('mouseleave', () => clearHighlight());
    ul.appendChild(li);
  });
})();

/* =========================================================
   Graph setup
   ========================================================= */
const svg = d3.select('#graph');
const width = window.innerWidth;
const height = window.innerHeight;
svg.attr('viewBox', [0, 0, width, height]);

const defs = svg.append('defs');

// Radial gradients per group
Object.entries(palette).forEach(([k, p]) => {
  const grad = defs.append('radialGradient')
    .attr('id', `grad-${k}`)
    .attr('cx', '35%').attr('cy', '35%').attr('r', '75%');
  grad.append('stop').attr('offset', '0%').attr('stop-color', '#ffffff').attr('stop-opacity', 0.95);
  grad.append('stop').attr('offset', '35%').attr('stop-color', p.solid).attr('stop-opacity', 1);
  grad.append('stop').attr('offset', '100%').attr('stop-color', p.deep).attr('stop-opacity', 0.95);
});

// Glow
const glow = defs.append('filter')
  .attr('id', 'glow')
  .attr('x', '-100%').attr('y', '-100%').attr('width', '300%').attr('height', '300%');
glow.append('feGaussianBlur').attr('stdDeviation', '5').attr('result', 'blur');
const merge = glow.append('feMerge');
merge.append('feMergeNode').attr('in', 'blur');
merge.append('feMergeNode').attr('in', 'SourceGraphic');

const g = svg.append('g');
svg.call(d3.zoom().scaleExtent([0.3, 3]).on('zoom', (e) => g.attr('transform', e.transform)));

const idToNode = Object.fromEntries(nodes.map(n => [n.id, n]));
const linkData = links.map(l => ({ source: l.s, target: l.t, rel: l.rel, type: l.type || 'soft' }));

const neighbors = {};
linkData.forEach(l => {
  (neighbors[l.source] ||= new Set()).add(l.target);
  (neighbors[l.target] ||= new Set()).add(l.source);
});

const minDim = Math.min(width, height);
const sim = d3.forceSimulation(nodes)
  .alphaDecay(0.012)
  .velocityDecay(0.38)
  .force('link', d3.forceLink(linkData).id(d => d.id)
    .distance(l => l.type === 'backbone' ? 155 : 135)
    .strength(l => l.type === 'backbone' ? 0.65 : 0.22))
  .force('charge', d3.forceManyBody().strength(-760).distanceMax(1100))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collide', d3.forceCollide().radius(d => d.size + 38).strength(0.92))
  .force('radial', d3.forceRadial(d => {
    if (d.id === 'karthik') return 0;
    if (d.group === 'cosmos' && d.kind === 'wisdom') return minDim * 0.46;
    if (d.group === 'cosmos') return minDim * 0.34;
    return minDim * 0.19;
  }, width / 2, height / 2).strength(0.085));

// Ambient drift — the graph breathes on its own so you never have to drag
sim.force('drift', function() {
  const t = Date.now() * 0.0004;
  nodes.forEach((n, i) => {
    if (n.fx != null) return;
    n.vx += Math.sin(t + i * 0.37) * 0.035;
    n.vy += Math.cos(t + i * 0.53) * 0.035;
  });
});

// Keep a tiny heat so forces stay live and motion never fully stops
setTimeout(() => sim.alphaTarget(0.012).restart(), 1600);

/* =========================================================
   Draw links
   ========================================================= */
const linkSel = g.append('g').attr('class', 'links')
  .selectAll('line')
  .data(linkData)
  .join('line')
  .attr('class', d => 'link' + (d.type === 'backbone' ? ' backbone' : ''));

// Edge verb labels
const labelSel = g.append('g').attr('class', 'edge-labels')
  .selectAll('text')
  .data(linkData)
  .join('text')
  .attr('class', 'edge-label')
  .attr('text-anchor', 'middle')
  .text(d => d.rel || '');

/* =========================================================
   Draw nodes
   ========================================================= */
const nodeSel = g.append('g').attr('class', 'nodes')
  .selectAll('g')
  .data(nodes)
  .join('g')
  .attr('class', d => {
    let c = 'node';
    if (d.id === 'karthik') c += ' core';
    if (d.kind === 'wisdom') c += ' wisdom';
    return c;
  })
  .call(d3.drag()
    .on('start', (event, d) => { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag',  (event, d) => { d.fx = event.x; d.fy = event.y; })
    .on('end',   (event, d) => { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

// Outer halo
nodeSel.append('circle')
  .attr('class', 'halo')
  .attr('r', d => d.size * 2.4)
  .attr('fill', d => palette[d.group].solid);

// Body with radial gradient
nodeSel.append('circle')
  .attr('class', 'body')
  .attr('r', d => d.size)
  .attr('fill', d => `url(#grad-${d.group})`)
  .attr('filter', 'url(#glow)');

// Highlight speck
nodeSel.append('circle')
  .attr('r', d => d.size * 0.25)
  .attr('cx', d => -d.size * 0.25)
  .attr('cy', d => -d.size * 0.25)
  .attr('fill', 'rgba(255,255,255,0.55)')
  .attr('pointer-events', 'none');

nodeSel.append('text')
  .attr('dy', d => d.size + 16)
  .attr('text-anchor', 'middle')
  .text(d => d.label);

// Pulsing rings on core
const coreSel = nodeSel.filter(d => d.id === 'karthik');
coreSel.insert('circle', ':first-child').attr('class', 'pulse-ring').attr('fill', 'none');
coreSel.insert('circle', ':first-child').attr('class', 'pulse-ring delay').attr('fill', 'none');

nodeSel
  .on('mouseenter', (e, d) => highlightNode(d.id))
  .on('mouseleave', () => clearHighlight())
  .on('click', (e, d) => showPanel(d));

sim.on('tick', () => {
  linkSel
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  labelSel
    .attr('x', d => (d.source.x + d.target.x) / 2)
    .attr('y', d => (d.source.y + d.target.y) / 2 - 3);
  nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
});

/* =========================================================
   Interaction
   ========================================================= */
function highlightNode(id) {
  const keep = neighbors[id] || new Set();
  keep.add(id);
  nodeSel.classed('faded', d => !keep.has(d.id));
  linkSel
    .classed('faded', l => l.source.id !== id && l.target.id !== id)
    .classed('active', l => l.source.id === id || l.target.id === id);
  labelSel.classed('active', l => l.source.id === id || l.target.id === id);
}

function highlightGroup(group) {
  nodeSel.classed('faded', d => d.group !== group && d.id !== 'karthik');
  linkSel.classed('faded', l => l.source.group !== group && l.target.group !== group);
  labelSel.classed('active', l => l.source.group === group && l.target.group === group);
}

function clearHighlight() {
  nodeSel.classed('faded', false);
  linkSel.classed('faded', false).classed('active', false);
  labelSel.classed('active', false);
}

function showPanel(d) {
  const p = document.getElementById('panel');
  document.getElementById('panel-eyebrow').textContent = groupLabels[d.group];
  document.getElementById('panel-title').textContent = d.label.replace(' ✦', '');
  document.getElementById('panel-body').textContent = d.desc;
  const chips = document.getElementById('panel-chips');
  chips.innerHTML = '';
  const related = [...(neighbors[d.id] || [])].slice(0, 7);
  related.forEach(rid => {
    const n = idToNode[rid];
    if (!n) return;
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.style.borderColor = palette[n.group].solid + '66';
    chip.style.color = palette[n.group].solid;
    chip.textContent = n.label.replace(' ✦', '');
    chip.addEventListener('click', (ev) => {
      ev.stopPropagation();
      highlightNode(n.id); showPanel(n);
    });
    chips.appendChild(chip);
  });
  p.classList.add('active');
}

setTimeout(() => showPanel(idToNode.karthik), 700);

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  svg.attr('viewBox', [0, 0, w, h]);
  sim.force('center', d3.forceCenter(w / 2, h / 2)).alpha(0.3).restart();
});
</script>
</body>
